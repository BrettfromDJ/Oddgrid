<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oddgrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --ground:#0B0B0D;
  --ink:#E6E5E1;
  --ink-dim:#8B8B95;
  --ink-faint:#5C5C66;
  --line:#1F1F25;
  --amber:#FFB020;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;
  background:var(--ground);color:var(--ink);
  font-family:var(--mono);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
  padding:14vh 24px 64px;
}
main{width:100%;max-width:540px}

header{margin-bottom:9vh}
h1{
  margin:0;font-size:13px;font-weight:500;
  letter-spacing:.34em;text-transform:uppercase;
}
header p{
  margin:10px 0 0;color:var(--ink-faint);font-size:13px;letter-spacing:.02em;
}

ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}

a.tool{
  display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;
  padding:20px 2px;text-decoration:none;color:inherit;
  transition:padding-left .18s ease;
}
a.tool:hover,a.tool:focus-visible{padding-left:8px;outline:none}
a.tool:focus-visible .name{text-decoration:underline;text-underline-offset:4px}

.name{grid-column:1;grid-row:1;font-size:16px;letter-spacing:.01em;transition:color .18s ease}
a.tool:hover .name,a.tool:focus-visible .name{color:var(--amber)}
.desc{
  grid-column:1;grid-row:2;margin-top:5px;
  color:var(--ink-dim);font-size:12.5px;letter-spacing:.02em;
}
.mark{
  grid-column:2;grid-row:1;color:var(--ink-faint);font-size:13px;
  transition:color .18s ease,transform .18s ease;
}
a.tool:hover .mark,a.tool:focus-visible .mark{color:var(--amber);transform:translateX(3px)}

footer{margin-top:9vh;color:var(--ink-faint);font-size:12px;letter-spacing:.02em}
footer a{color:var(--ink-faint);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover,footer a:focus-visible{color:var(--amber);border-bottom-color:var(--amber);outline:none}

@media (prefers-reduced-motion:reduce){
  a.tool,.name,.mark{transition:none}
  a.tool:hover,a.tool:focus-visible{padding-left:2px}
  a.tool:hover .mark,a.tool:focus-visible .mark{transform:none}
}
@media (max-width:520px){
  body{padding:10vh 20px 48px}
  header{margin-bottom:7vh}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Oddgrid</h1>
    <p>Small tools, made as needed.</p>
  </header>

  <ul>
    <li>
      <a class="tool" href="pixel-type.html">
        <span class="name">Pixel Type</span>
        <span class="mark" aria-hidden="true">&rarr;</span>
        <span class="desc">Text and images on an animated dot grid. Exports an embed.</span>
      </a>
    </li>
  </ul>

  <footer><a href="https://github.com/BrettfromDJ/Oddgrid">Source on GitHub</a></footer>
</main>
</body>
</html>
